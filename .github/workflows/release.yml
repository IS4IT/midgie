# Release: pushing a version tag (e.g. v0.1.0) first runs the whole CI workflow on the tagged commit. Only
# if all of it passes does it build the fat JAR stamped with the tag's version, push the multi-arch
# container image to docker.io/is4it/midgie, and publish a GitHub Release with the JAR, its SHA-256, the
# Helm chart and the SBOM attached, each labelled with what it is. Its notes are the version's section
# of CHANGELOG.md plus a Downloads section that links the image and names the digest just pushed. The pom
# stays on -SNAPSHOT; the tag is the single source of truth for the release version, applied with
# versions:set.
#
# Every other build reads the same tag for itself, with 'git describe' (see pom.xml, stamp-version-from-git),
# and falls back to the pom version when git cannot name one — which is why versions:set stays here: it makes
# that fallback the tag as well, so a release cannot be mislabelled even if the checkout has no usable tag.
#
# What a release can be checked against (docs/install.md "Verifying a release" has the commands):
# - the JAR and the Helm chart carry a SLSA build-provenance attestation, and the JAR an SBOM attestation
#   for midgie-<version>.cdx.json (the CycloneDX SBOM the build writes, attached to the release as well);
# - the image is signed with cosign and carries a provenance attestation, both attached to it in Docker Hub
#   as OCI referrers (cosign 3 stores its signature that way, not as a sha256-<digest>.sig tag), plus
#   BuildKit's SBOM of its OS packages.
# All of it is keyless: signed with a short-lived Sigstore certificate issued to this workflow, so there is
# no signing key to keep, and a signature names the workflow and ref that made it.
#
# The image push needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access
# token with Read/Write on is4it/midgie).
#
# To cut a release: update CHANGELOG.md (move Unreleased -> the new version) and set version and appVersion
# in charts/midgie/Chart.yaml to it, commit both as "Release 0.1.0", then:
#   git tag -a v0.1.0 -m "midgie 0.1.0" && git push origin v0.1.0
# The chart is packaged below with the tag's version whatever Chart.yaml says; the bump keeps a chart
# packaged from a checkout installing the same release.
#
# Run it by hand ('gh workflow run Release -f tag=v0.1.0') to rebuild and push the image for a tag that is
# already released — an image-only fix (a base-image CVE, a missing tool) then costs no version bump. The
# same steps build it, so the rebuilt image cannot drift from the released one. The GitHub Release is left
# alone, and ':latest' only moves if you ask for it: rebuilding an older tag must not drag 'latest' back.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # v0.1.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # pre-releases, e.g. v0.1.0-rc1
  workflow_dispatch:
    inputs:
      tag:
        description: 'Released tag to rebuild the image for (e.g. v0.1.0)'
        required: true
        type: string
      update_latest:
        description: "Also move ':latest' to it (only for the newest release)"
        required: false
        default: false
        type: boolean

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Rebuild image for {0}', inputs.tag) || format('Release {0}', github.ref_name) }}

permissions: {}

env:
  # The tag being built: the one pushed, or the one asked for by hand.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The whole CI workflow, on the tagged commit itself, before anything is built for publishing: a red build,
  # test, chart, REUSE, secret, licence or vulnerability check stops the release. It runs here rather than
  # being looked up, so a commit CI never saw, or whose run a later push to main cancelled, cannot slip
  # through. A rebuild by hand skips it: it rebuilds the image for a tag that passed this when released.
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Build & publish
    needs: ci
    # A skipped CI only counts for the rebuild by hand; on a tag push it must have passed.
    if: >-
      !cancelled() && (needs.ci.result == 'success'
      || (needs.ci.result == 'skipped' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write            # create the GitHub Release
      id-token: write            # the OIDC token Sigstore issues the signing certificate against
      attestations: write        # store the attestations with the repository
      artifact-metadata: write   # the storage record actions/attest writes for the pushed image
    steps:
      # A dispatch takes the tag as free text, and a branch name would sail through as a "version":
      # 'main' carries no '-', so it would be treated as a final release and could take ':latest' with it.
      - name: Check the requested tag is a version tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'; then
            echo "::error::'$TAG' is not a version tag (expected v1.2.3 or v1.2.3-rc1)."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # With the tags present, the build's own 'git describe' arrives at the same version versions:set
          # stamps below, so the two cannot disagree about what this JAR is.
          fetch-depth: 0
          # This job's token can write to the repository, and the build runs tests and plugins fetched from
          # outside it. Nothing here pushes with git — the release step gets the token in its own environment —
          # so the token is not left in .git/config for anything else to find.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Derive version from tag
        # REVISION is read from the checkout, not from github.sha: a dispatch runs from a branch, so
        # github.sha is that branch's head and would label the image with a commit it was not built from.
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Stamp the release version into the build
        # versions:set rewrites pom.xml, and the build's own 'git describe --dirty' would then call the tag's
        # checkout modified: every released JAR reported itself as '<version>-dirty'. The rewrite is part of
        # the release, not a change to it, so git is told to leave pom.xml out of that question.
        run: |
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          git update-index --assume-unchanged pom.xml

      - name: Build & test
        run: mvn -B -ntp verify

      # The .sha256 is in sha256sum's own format, so 'sha256sum -c' checks a download without gh or cosign.
      - name: Name the artifacts with the version
        run: |
          cp target/midgie.jar "midgie-${VERSION}.jar"
          cp target/bom.json "midgie-${VERSION}.cdx.json"
          sha256sum "midgie-${VERSION}.jar" > "midgie-${VERSION}.jar.sha256"

      # --- container image (docker.io/is4it/midgie) ---------------------------
      # Before the GitHub Release, so a registry failure does not leave a published release advertising an
      # image that was never pushed. The JAR is architecture-independent and already built, so only the
      # base image's apt install runs under emulation.
      - name: Set up QEMU (for the linux/arm64 layer)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        # A pre-release must not become ':latest' — same reason the GitHub Release is marked prerelease.
        # A tag push is always the newest release, so it takes ':latest'; a rebuild by hand only does when
        # asked, since rebuilding an older tag would otherwise pull 'latest' backwards.
        env:
          UPDATE_LATEST: ${{ github.event_name == 'push' || inputs.update_latest }}
        run: |
          tags="is4it/midgie:${VERSION}"
          case "$VERSION" in
            *-*) ;;
            *)   if [ "$UPDATE_LATEST" = "true" ]; then tags="${tags},is4it/midgie:latest"; fi ;;
          esac
          echo "IMAGE_TAGS=${tags}" >> "$GITHUB_ENV"

      - name: Build & push the image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/midgie/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # BuildKit's own SBOM of the image: the OS packages and the JRE, which the Maven SBOM cannot see.
          sbom: true
          build-args: JAR=midgie-${{ env.VERSION }}.jar
          tags: ${{ env.IMAGE_TAGS }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.REVISION }}

      # Both by digest, never by tag: a tag can be moved after the fact, the digest is what was just pushed.
      # A rebuild by hand signs and attests its new image too, since that is what the tag now points to.
      - name: Attest the image's provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/is4it/midgie
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # For cluster admission policies (Kyverno, Sigstore policy-controller) that check a cosign signature
      # rather than a GitHub attestation. Uses the Docker Hub login above to store the signature.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "docker.io/is4it/midgie@${DIGEST}"

      # Only a tag push publishes. A rebuild by hand stops at the image: the release, its notes, its JAR and
      # its chart already exist and describe the same commit.
      - name: Package the Helm chart
        if: github.event_name == 'push'
        # The chart's version tracks the release rather than the number in Chart.yaml, so every publish is
        # uniquely versioned without anyone having to remember to bump it — which is what a Helm repo needs,
        # and what stops two different charts going out as the same version. appVersion follows too: the
        # chart's job is to install this release.
        run: |
          helm package charts/midgie --destination . \
            --version "$VERSION" --app-version "$VERSION"
          test -f "midgie-${VERSION}.tgz"

      # Before the GitHub Release, for the same reason as the image: a published release should not be
      # missing what it is meant to be checked against.
      - name: Attest the JAR's and the chart's provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            midgie-${{ env.VERSION }}.jar
            midgie-${{ env.VERSION }}.tgz

      - name: Attest the JAR's SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: midgie-${{ env.VERSION }}.jar
          sbom-path: midgie-${{ env.VERSION }}.cdx.json

      # The version's CHANGELOG section, then what each download is for. The image cannot be attached, so
      # the notes link it and name the digest this run pushed: an image-only rebuild later moves the version
      # tag, and the digest is what still names this release's bytes. Links are absolute and pinned to the
      # tag, since a relative link in a release body does not resolve against the repository.
      - name: Write the release notes
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          docs="${repo}/blob/${TAG}/docs"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && (/^## \[/ || /^\[[^]]*\]: /) { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See [CHANGELOG.md](${repo}/blob/${TAG}/CHANGELOG.md)." > release-notes.md
          fi
          cat >> release-notes.md <<EOF

          ### Downloads

          - **Standalone binary:** \`midgie-${VERSION}.jar\`, below. Run it with \`java -jar midgie-${VERSION}.jar --help\` (Java 21 or later); see [Installing midgie](${docs}/install.md). \`midgie-${VERSION}.jar.sha256\` holds its checksum: \`sha256sum -c midgie-${VERSION}.jar.sha256\`.
          - **Container image:** [\`is4it/midgie:${VERSION}\`](https://hub.docker.com/r/is4it/midgie/tags?name=${VERSION}) on Docker Hub, for \`linux/amd64\` and \`linux/arm64\`. This release built \`docker.io/is4it/midgie:${VERSION}@${DIGEST}\`; pin that digest to keep the same bytes after an image-only rebuild moves the tag. See [Container image and Helm chart](${docs}/container.md).
          - **Helm chart:** \`midgie-${VERSION}.tgz\`, below: \`helm install midgie ${repo}/releases/download/${TAG}/midgie-${VERSION}.tgz -n midgie --create-namespace\`
          - **SBOM:** \`midgie-${VERSION}.cdx.json\`, below. It lists every library the JAR bundles, in CycloneDX format; [Verifying a release](${docs}/install.md#verifying-a-release) checks it against the JAR.
          EOF

      # gh rather than a release action, for the asset labels ('file#label'): the release page shows them in
      # place of the file names, which stay as they are for download URLs. gh creates the release as a draft,
      # uploads, and only then publishes it — deleting the draft if an upload fails — so a release never
      # appears without its files; a file that is missing fails the step.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The tag filter admits pre-releases (v0.4.0-rc1). Without this an RC is published as a normal
          # release and becomes the repository's "Latest", so releases/latest/download hands it to everyone.
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "midgie ${VERSION}" \
            --notes-file release-notes.md "${prerelease[@]}" \
            "midgie-${VERSION}.jar#Standalone binary (java -jar, Java 21+): midgie-${VERSION}.jar" \
            "midgie-${VERSION}.jar.sha256#SHA-256 of the binary: midgie-${VERSION}.jar.sha256" \
            "midgie-${VERSION}.tgz#Helm chart: midgie-${VERSION}.tgz" \
            "midgie-${VERSION}.cdx.json#SBOM of the JAR (CycloneDX): midgie-${VERSION}.cdx.json"
