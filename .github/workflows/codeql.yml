# Static analysis with CodeQL: the Java sources, and the workflows themselves (script injection through
# untrusted event values, over-broad tokens). Findings land in the repository's Security tab as code
# scanning alerts; they do not fail the run.
#
# The weekly run catches what a new CodeQL query finds in code that has not changed.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'   # Mondays 04:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      security-events: write   # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built by hand rather than autobuild, so CodeQL sees the same compilation 'mvn verify' does.
          - language: java-kotlin
            build-mode: manual
            timeout: 30
          - language: actions
            build-mode: none
            timeout: 10
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # nothing here pushes; keep the token out of .git/config

      - name: Set up JDK 21
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Main and test sources, without running the tests: analysis needs the compilation, not the results.
      # The shallow checkout has no tag for the version stamp, which logs an error and carries on; the
      # version is irrelevant here.
      - name: Compile
        if: matrix.build-mode == 'manual'
        run: mvn -B -ntp -DskipTests test-compile

      - name: Analyse
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
