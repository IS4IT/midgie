# Submits midgie's full Maven dependency tree to GitHub's dependency graph. On its own, GitHub reads only
# the direct dependencies from pom.xml: midpoint-schema, picocli, junit. Nearly everything the JAR ships
# (prism, JAXB, Spring, Jackson, ...) arrives transitively, and Dependabot alerts only cover what the
# graph knows about.
name: Dependency graph

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-graph
  cancel-in-progress: true

jobs:
  submit:
    name: Submit Maven dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # the dependency submission API requires it
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # the action takes the token as its own input

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Submit the dependency tree
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
