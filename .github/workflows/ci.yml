name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the compile target (maven.compiler.release); 21 proves the LTS range runs too.
        java: ['17', '21']
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # verify = test + the shade fat-JAR build, so it also guards the prism/shade packaging
      # wrinkle called out in CLAUDE.md. The rig-gated live tests self-skip when no server is present.
      - name: Build & test
        run: mvn -B -ntp verify

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: REUSE lint
        uses: fsfe/reuse-action@v5
