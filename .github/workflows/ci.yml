name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs all of this on the tagged commit before it publishes anything.
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR). A run called by a release is grouped
# under its tag, so a push to main cannot cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 21 is the compile target (maven.compiler.release); 25 proves the next LTS runs it too.
        java: ['21', '25']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; keep the token out of .git/config
          # Tags, not just the tip: the build stamps the version into the JAR with 'git describe', and a
          # shallow checkout has no tag to describe — the JAR would claim the pom's placeholder version.
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # verify = test + the shade fat-JAR build, so it also guards the prism/shade packaging
      # wrinkle called out in CLAUDE.md. The rig-gated live tests self-skip when no server is present.
      - name: Build & test
        run: mvn -B -ntp verify

  image:
    name: Container image (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; keep the token out of .git/config
          fetch-depth: 0   # same reason as the build job: 'git describe' needs the tags

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The build job already ran the tests; this one only needs a JAR to put in the image.
      - name: Build the JAR
        run: mvn -B -ntp -DskipTests package

      - name: Set up QEMU (for the linux/arm64 layer)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Built for both platforms but never pushed, so a Dockerfile that breaks on arm64 fails here rather
      # than halfway through a release. A multi-arch build cannot be loaded into the local daemon, so
      # there is nothing to run afterwards — the release job is the only thing that publishes.
      - name: Build the image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/midgie/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; keep the token out of .git/config

      # helm ships with the GitHub-hosted runner image; no action to pin for this.
      - name: Lint and render
        run: |
          helm lint charts/midgie
          helm template midgie charts/midgie > /dev/null
          # Again with the optional paths on, since those templates are otherwise never rendered — the
          # ssh block also carries a 'required', which only fires when ssh.enabled is set.
          helm template midgie charts/midgie \
            --set midpoint.url=https://mp.example/midpoint \
            --set midpoint.user=administrator \
            --set midpoint.password=s3cret \
            --set ssh.enabled=true \
            --set ssh.existingSecret=git-key \
            --set ssh.acceptNewHostKeys=true \
            --set serviceAccount.create=true \
            --set persistence.existingClaim=someones-claim > /dev/null
          # The OpenShift preset must keep removing the three fields its SCC rejects; a default that
          # stopped being nulled would only show up as a pod that never schedules.
          helm template midgie charts/midgie -f charts/midgie/values-openshift.yaml \
            | grep -qE 'runAsUser|runAsGroup|fsGroup' \
            && { echo "::error::values-openshift.yaml still pins a UID/GID"; exit 1; } || true
          # The release attaches a packaged chart, versioned with the tag. Prove that packs here, where a
          # failure costs a red PR rather than a half-published release.
          helm package charts/midgie --destination /tmp --version 0.0.0-ci --app-version 0.0.0-ci
          test -f /tmp/midgie-0.0.0-ci.tgz

  # Both checks read the CycloneDX SBOM the build writes, so they judge exactly what the JAR bundles.
  dependencies:
    name: Licences & vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; keep the token out of .git/config

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The SBOM is written in the package phase; the build job runs the tests.
      - name: Build the SBOM
        run: mvn -B -ntp -DskipTests package

      # A licence not in the allowlist fails here; the file says what to check before adding one.
      - name: Check the licences
        run: python3 -I .github/scripts/check-licences.py target/bom.json .github/sbom-licences.txt

      # Downloaded and checked against the release's published SHA-256, like gitleaks above. The scan uses
      # the SBOM's Maven coordinates, so it needs only Trivy's vulnerability database, not its Java one.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" trivy

      # Any HIGH or CRITICAL CVE fails, fixed upstream or not. An exception goes into .trivyignore with an
      # expiry date, after which it stops applying.
      - name: Check for known vulnerabilities
        run: |
          "$RUNNER_TEMP/trivy" sbom --severity CRITICAL,HIGH --exit-code 1 --ignorefile .trivyignore \
            --skip-java-db-update target/bom.json

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; keep the token out of .git/config

      - name: REUSE lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; keep the token out of .git/config
          fetch-depth: 0   # the whole history: a secret removed in a later commit is still published

      # The CLI rather than gitleaks-action, which needs a paid licence on an organisation's repositories.
      # The download is checked against the release's published SHA-256, so a replaced asset fails here.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      # Reads .gitleaks.toml and .gitleaksignore from the checkout. --redact keeps a found secret out of
      # this public log.
      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
