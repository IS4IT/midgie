#
# TLS reverse proxy in front of the plain-HTTP midPoint (mp_server:8080). Presents the private-CA-signed
# server cert on 8443 so the midgie client's --cacert / --insecure paths can be tested end to end.
server {
    listen 8443 ssl;
    server_name mp-tls;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    client_max_body_size 20m;

    location / {
        proxy_pass http://mp_server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
