{{- if and .Values.midpoint.password (not .Values.midpoint.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "midgie.fullname" . }}
  labels:
    {{- include "midgie.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.midpoint.passwordKey }}: {{ .Values.midpoint.password | quote }}
{{- end }}
