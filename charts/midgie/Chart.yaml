apiVersion: v2
name: midgie
description: A midgie pod to exec into, with a persistent volume for git checkouts
type: application

# Both versions are overridden at package time by the release workflow, which stamps the release's
# version into each — what ships is always midgie-<release>.tgz. These are what a 'helm package' by
# hand produces, kept in step with the release they describe.
version: 0.5.1

# The midgie release the chart installs by default (image.tag overrides it).
appVersion: "0.5.1"

home: https://github.com/IS4IT/midgie
sources:
  - https://github.com/IS4IT/midgie
keywords:
  - midpoint
  - identity-management
  - gitops
maintainers:
  - name: IS4IT
    url: https://github.com/IS4IT
