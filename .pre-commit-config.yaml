# Checks run on every commit, once 'pre-commit install' has been run in the clone. The CI 'Secret scan'
# job repeats the gitleaks check for every push, so a clone without the hook is caught there.
#
# Revisions are commit SHAs, not tags: a tag can be moved to other code, a SHA cannot. Update them with
# 'pre-commit autoupdate --freeze'.
#
# No whitespace or end-of-file fixers: they would rewrite the golden files under src/test/resources,
# whose exact bytes the tests compare against.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        # Helm templates are Go templates that render to YAML, not YAML themselves.
        exclude: ^charts/midgie/templates/
